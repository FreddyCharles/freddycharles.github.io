    <!-- Supporting Fonts and Embedded Styling to Extend style.css variables to form elements -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        /* Extended Custom Controls mapping directly to the Swiss Design Token variables in style.css */
        input[type="text"], input[type="number"], select {
            background-color: #0c0c0e;
            border: 1px solid var(--border-color);

            font-family: var(--font-mono);

            outline: none;

        label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
            display: block;

            color: var(--text-secondary);

        /* Monospace Swiss Grid Metrics */

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            border-bottom: 1px solid var(--border-color);

        /* Responsive Layout Panels */

        @media (min-width: 1200px) {

        .panel-content {

        /* High-contrast custom scrollbar */

        /* Generalized Custom Table */
        .swiss-table-container {
            overflow-x: auto;

        }
        .swiss-table {
            width: 100%;

        .swiss-table th {

            color: var(--text-secondary);

            font-weight: 700;
        }
        .swiss-table td {
            padding: 0.85rem;

        }
        .swiss-table tr:hover td {

        .swiss-table tr.highlighted td {

        /* Form Layout Subsections */
        .form-block {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;

            padding-bottom: 1.5rem;
        }
        .form-block:last-child {
            border-bottom: none;

        }
        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Interactive Trigger Buttons */
        .btn-action {
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 0.75rem 1.25rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;

        }
        .btn-action:hover {
            background: var(--swiss-red);

        .btn-action-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);

            font-size: 0.7rem;

        .btn-action-secondary:hover {

        /* Panel Information Box */
        .info-panel {
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.01);

            color: var(--text-secondary);
        }
        .info-panel-title {
            font-family: var(--font-mono);
            font-size: 0.75rem;

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .badge-warning {
            color: #ff9500;
            border: 1px solid #ff9500;
            font-size: 0.65rem;

            text-transform: uppercase;
            font-family: var(--font-mono);
            display: inline-block;

    </style>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Vector Icons
        const Icons = {
            Plus: () => (
                <svg className="svg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
                </svg>
            ),
            Trash: () => (
                <svg className="svg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            )
        };

        // 1. Corrected Income Tax and National Insurance calculation engine
        function calculateUKIncomeTaxAndNI(grossIncome, isRetirement = false, isScottish = false) {
            let personalAllowance = 12570;
            
            // Fix Personal Allowance Tapering Bug
            if (grossIncome > 100000) {
                const reduction = (grossIncome - 100000) / 2;
                personalAllowance = Math.max(0, 12570 - reduction);
            }

            let tax = 0;
            let taxableIncome = Math.max(0, grossIncome - personalAllowance);

            if (isScottish) {
                // Correct 2026/27 Scottish Earned Income Tax Bands
                const bands = [
                    { limit: 3967, rate: 0.19 },
                    { limit: 16956, rate: 0.20 },
                    { limit: 31092, rate: 0.21 },
                    { limit: 62430, rate: 0.42 },
                    { limit: 125140, rate: 0.45 },
                    { limit: Infinity, rate: 0.48 }
                ];
                let remaining = taxableIncome;
                let lastLimit = 0;
                for (let i = 0; i < bands.length; i++) {
                    const width = bands[i].limit - lastLimit;
                    const taxableInBand = Math.min(remaining, width);
                    tax += taxableInBand * bands[i].rate;
                    remaining -= taxableInBand;
                    lastLimit = bands[i].limit;
                    if (remaining <= 0) break;
                }
            } else {
                // Fix Hardcoded Higher Rate Band Span Bug
                const basicRateMax = 37700;
                const basicRateTaxable = Math.min(taxableIncome, basicRateMax);
                tax += basicRateTaxable * 0.20;

                // Dynamic higher rate band limit that scales with the tapered allowance
                const higherRateMax = 125140 - personalAllowance - basicRateMax;
                const remainingTaxable = Math.max(0, taxableIncome - basicRateTaxable);
                const higherRateTaxable = Math.min(remainingTaxable, higherRateMax);
                tax += higherRateTaxable * 0.40;

                const additionalRateTaxable = Math.max(0, remainingTaxable - higherRateTaxable);
                if (additionalRateTaxable > 0) {
                    tax += additionalRateTaxable * 0.45;
                }
            }

            // Dynamic Employee Class 1 National Insurance Calculation
            let ni = 0;
            if (!isRetirement && grossIncome > 12570) {
                const standardBandEarnings = Math.min(grossIncome, 50270) - 12570;
                ni += standardBandEarnings * 0.08;

                if (grossIncome > 50270) {
                    const upperBandEarnings = grossIncome - 50270;
                    ni += upperBandEarnings * 0.02;
                }
            }

            return { tax, ni, net: Math.max(0, grossIncome - tax - ni) };
        }

        // 2. Multi-Plan Student Loan Deduction Algorithm
        function calculateStudentLoanRepayments(grossIncome, activePlans = []) {
            const plans = {
                'Plan1': { threshold: 26900, rate: 0.09 },
                'Plan2': { threshold: 29385, rate: 0.09 },
                'Plan5': { threshold: 25000, rate: 0.09 },
                'Postgrad': { threshold: 21000, rate: 0.06 }
            };

            let annualDeduction = 0;
            let breakdown = { undergraduate: 0, postgraduate: 0 };

            const activeUGPlans = activePlans.filter(p => p !== 'Postgrad');
            const hasPostgrad = activePlans.includes('Postgrad');

            // Multi-UG Plan Rule: Repay 9% above the lowest active threshold
            if (activeUGPlans.length > 0) {
                const lowestThreshold = Math.min(...activeUGPlans.map(p => plans[p].threshold));
                const ugRepayment = Math.max(0, grossIncome - lowestThreshold) * 0.09;
                annualDeduction += ugRepayment;
                breakdown.undergraduate = ugRepayment;
            }

            // Postgraduate Loan Rule: Repay 6% above the postgraduate threshold independently
            if (hasPostgrad) {
                const pgRepayment = Math.max(0, grossIncome - plans['Postgrad'].threshold) * 0.06;
                annualDeduction += pgRepayment;
                breakdown.postgraduate = pgRepayment;
            }

            return {
                annualDeduction,
                monthlyDeduction: annualDeduction / 12,
                breakdown
            };
        }

        // 3. Transitional 2027 ISA Allowance Validator
        function validateISAContributions(year, age, cashISADeposit, stockISADeposit, lisaDeposit) {
            const totalISA = cashISADeposit + stockISADeposit + lisaDeposit;
            let validationErrors = [];
            let cashISALimit = 20000;

            if (totalISA > 20000) {
                validationErrors.push("Total contributions across all ISAs cannot exceed £20,000 per tax year.");
            }

            if (lisaDeposit > 4000) {
                validationErrors.push("Lifetime ISA contributions are capped at £4,000 per tax year.");
            }

            // Model scheduled 6 April 2027 reduction in Cash ISA allowance for under-65s
            if (year >= 2027 && age < 65) {
                cashISALimit = 12000;
                if (cashISADeposit > cashISALimit) {
                    validationErrors.push(`From April 2027, the Cash ISA limit for savers under 65 drops to £12,000. Excess redirected.`);
                }
            }

            return {
                isValid: validationErrors.length === 0,
                errors: validationErrors,
                cashLimit: cashISALimit
            };
        }

        // Numerical Solver to find the required gross pension withdrawal matching a target net payout.
        // Accounts for existing taxable income (e.g. State Pension) and the 25% tax-free lump sum (UFPLS).
        function solveGrossPensionWithdrawal(targetNetNeeded, otherTaxableIncome = 0, isScottish = false) {
            if (targetNetNeeded <= 0) return 0;
            
            let low = targetNetNeeded;
            let high = targetNetNeeded * 4; 
            let iterations = 0;
            let solvedGross = targetNetNeeded;

            while (high - low > 0.01 && iterations < 50) {
                const mid = (low + high) / 2;
                
                // Under UFPLS rules, 25% of withdrawal is tax-free, 75% is taxable
                const taxFreeComponent = mid * 0.25;
                const taxableComponent = mid * 0.75;

                // Evaluate marginal tax added onto other taxable income
                const taxWithOnlyOtherIncome = calculateUKIncomeTaxAndNI(otherTaxableIncome, true, isScottish).tax;
                const totalTaxWithWithdrawal = calculateUKIncomeTaxAndNI(otherTaxableIncome + taxableComponent, true, isScottish).tax;
                const marginalTaxOwed = totalTaxWithWithdrawal - taxWithOnlyOtherIncome;

                const netResult = taxFreeComponent + (taxableComponent - marginalTaxOwed);

                if (netResult < targetNetNeeded) {
                    low = mid;
                } else {
                    high = mid;
                }
                solvedGross = mid;
                iterations++;
            }

            return solvedGross;
        }

        function App() {
            // Initial Baseline Parameters matching UK-specific scenarios
            const initialData = {
                current_age: 30,
                target_age: 60,
                current_pension_balance: 30000,
                current_isa_balance: 10000,
                current_salary: 55000, 
                annual_salary_growth_percent: 2.5,
                
                is_scottish: false,
                student_loan_plan: 'Plan2', // None, Plan1, Plan2, Plan5, Postgrad, Plan2_Postgrad
                
                // UK Pension Configurations
                employee_pension_percent: 6.0, 
                employer_pension_percent: 4.0, 
                pension_contribution_type: 'salary_sacrifice', // 'salary_sacrifice' or 'net_pay'
                
                // UK ISA Configurations
                cash_isa_percent: 0,
                stocks_isa_percent: 8.0,
                lisa_percent: 0,
                
                // Generic Projections
                expected_return_percent: 6.5,
                inflation_percent: 2.5,
                monthly_bills: 1800, 
                
                // Decumulation Parameters
                retire_annual_spend_today: 32000, 
                retire_growth_percent: 4.5, 
                decumulation_strategy: 'isa_first', // 'isa_first' or 'pension_first'
                
                // State Pension Configuration
                state_pension_active: true,
                state_pension_age: 67,
                state_pension_amount_today: 11502, // 2024/25 full State Pension rate

                events: [
                    { id: 1, age: 40, type: 'salary_change', value: 75000, description: 'Promotion to Lead Practice Specialist' },
                    { id: 2, age: 50, type: 'salary_change', value: 95000, description: 'Principal Director Transition' }
                ]
            };

            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem("high_fidelity_wealth_config");
                return saved ? JSON.parse(saved) : initialData;
            });

            const [activeTab, setActiveTab] = useState('projection'); 
            const [newEvent, setNewEvent] = useState({ age: 45, type: 'salary_change', value: '', description: '' });
            const [validationError, setValidationError] = useState('');

            useEffect(() => {
                localStorage.setItem("high_fidelity_wealth_config", JSON.stringify(config));
            }, [config]);

            const handleConfigChange = (key, value) => {
                let sanitized = value;
                if (['current_age', 'target_age', 'state_pension_age'].includes(key)) {
                    sanitized = Math.max(1, Math.min(110, parseInt(value) || 0));
                } else if (['current_pension_balance', 'current_isa_balance', 'current_salary', 'monthly_bills', 'retire_annual_spend_today', 'state_pension_amount_today'].includes(key)) {
                    sanitized = Math.max(0, parseFloat(value) || 0);
                } else if (['employee_pension_percent', 'employer_pension_percent', 'cash_isa_percent', 'stocks_isa_percent', 'lisa_percent', 'expected_return_percent', 'inflation_percent', 'annual_salary_growth_percent', 'retire_growth_percent'].includes(key)) {
                    sanitized = Math.max(0, parseFloat(value) || 0);
                }
                setConfig(prev => ({ ...prev, [key]: sanitized }));
            };

            const addEvent = () => {
                setValidationError('');
                const eventAge = parseInt(newEvent.age);
                const eventVal = parseFloat(newEvent.value);
                const eventDesc = newEvent.description.trim();

                if (isNaN(eventAge) || eventAge < config.current_age || eventAge > config.target_age) {
                    setValidationError(`Age must be between current age (${config.current_age}) and retirement age (${config.target_age}).`);
                    return;
                }
                if (isNaN(eventVal) || eventVal < 0) {
                    setValidationError('Provide a valid non-negative numeric modifier value.');
                    return;
                }
                if (!eventDesc) {
                    setValidationError('Provide a structural event identification tag.');
                    return;
                }

                const eventObj = {
                    id: Date.now(),
                    age: eventAge,
                    type: newEvent.type,
                    value: eventVal,
                    description: eventDesc
                };

                setConfig(prev => ({
                    ...prev,
                    events: [...prev.events, eventObj].sort((a, b) => a.age - b.age)
                }));
                setNewEvent({ age: Math.min(config.target_age, Math.max(config.current_age, 45)), type: 'salary_change', value: '', description: '' });
            };

            const removeEvent = (id) => {
                setConfig(prev => ({
                    ...prev,
                    events: prev.events.filter(e => e.id !== id)
                }));
            };

            const resetToDefault = () => {
                if (window.confirm("Restore default structural parameter profile?")) {
                    setConfig(initialData);
                    localStorage.setItem("high_fidelity_wealth_config", JSON.stringify(initialData));
                }
            };

            // Master Dual-Engine Core Projection Loop
            const projectionData = useMemo(() => {
                const current_age = Math.max(1, Math.min(100, parseInt(config.current_age) || 30));
                let target_age = Math.max(current_age, Math.min(110, parseInt(config.target_age) || 60));

                if (target_age - current_age > 80) {
                    target_age = current_age + 80;
                }

                let pension_balance = parseFloat(config.current_pension_balance) || 0;
                let isa_balance = parseFloat(config.current_isa_balance) || 0;
                let salary = parseFloat(config.current_salary) || 0;
                let employee_pension_percent = parseFloat(config.employee_pension_percent) || 0;
                let employer_pension_percent = parseFloat(config.employer_pension_percent) || 0;
                
                const monthly_bills_base = parseFloat(config.monthly_bills) || 0;

                const return_rate = (parseFloat(config.expected_return_percent) || 0) / 100;
                const inflation_rate = (parseFloat(config.inflation_percent) || 0) / 100;
                const wage_growth = (parseFloat(config.annual_salary_growth_percent) || 0) / 100;

                const events = config.events || [];
                const dataPoints = [];
                
                let cumulativeContributionsPension = 0;
                let cumulativeContributionsISA = 0;
                let annualPensionAllowanceWarningTriggered = false;

                let activeStudentLoanPlans = [];
                if (config.student_loan_plan === 'Plan1') activeStudentLoanPlans.push('Plan1');
                else if (config.student_loan_plan === 'Plan2') activeStudentLoanPlans.push('Plan2');
                else if (config.student_loan_plan === 'Plan5') activeStudentLoanPlans.push('Plan5');
                else if (config.student_loan_plan === 'Postgrad') activeStudentLoanPlans.push('Postgrad');
                else if (config.student_loan_plan === 'Plan2_Postgrad') { activeStudentLoanPlans.push('Plan2'); activeStudentLoanPlans.push('Postgrad'); }

                const currentYear = new Date().getFullYear();

                for (let age = current_age; age < target_age; age++) {
                    const year = currentYear + (age - current_age);
                    const ageEvents = events.filter(e => e.age === age);
                    let systemMessage = "";

                    ageEvents.forEach(ev => {
                        if (ev.type === 'salary_change') {
                            salary = parseFloat(ev.value) || 0;
                            systemMessage += `Salary: £${salary.toLocaleString()}. `;
                        } else if (ev.type === 'contribution_change') {
                            employee_pension_percent = parseFloat(ev.value) || 0;
                            systemMessage += `Ee Contribution: ${employee_pension_percent}%. `;
                        } else if (ev.type === 'expense') {
                            isa_balance = Math.max(0, isa_balance - (parseFloat(ev.value) || 0));
                            systemMessage += `Withdrew £${ev.value.toLocaleString()} from ISA (${ev.description}). `;
                        } else if (ev.type === 'windfall') {
                            isa_balance += parseFloat(ev.value) || 0;
                            systemMessage += `Injected £${ev.value.toLocaleString()} into ISA (${ev.description}). `;
                        }
                    });

                    // 1. Calculate Pension Contributions
                    const employeePensionContribution = salary * (employee_pension_percent / 100);
                    const employerPensionContribution = salary * (employer_pension_percent / 100);
                    const totalAnnualPensionContribution = employeePensionContribution + employerPensionContribution;

                    if (totalAnnualPensionContribution > 60000) {
                        annualPensionAllowanceWarningTriggered = true;
                    }

                    // 2. Compute Net Take-Home Pay based on UK Pension Arrangement Scheme and Student Loans
                    let taxableIncome = salary;
                    let taxAndNI = { tax: 0, ni: 0, net: 0 };
                    let actualNetTakeHome = 0;
                    let studentLoanDeduction = 0;

                    if (config.pension_contribution_type === 'salary_sacrifice') {
                        // Salary sacrifice lowers Gross salary directly before Tax, NI, and Student Loan calculations
                        taxableIncome = Math.max(0, salary - employeePensionContribution);
                        taxAndNI = calculateUKIncomeTaxAndNI(taxableIncome, false, config.is_scottish);
                        studentLoanDeduction = calculateStudentLoanRepayments(taxableIncome, activeStudentLoanPlans).annualDeduction;
                        actualNetTakeHome = taxAndNI.net - studentLoanDeduction;
                    } else {
                        // Net Pay Arrangement: Lower taxable gross before tax calculations, but NI and Student loans paid on full salary
                        const taxOnlyAdjusted = Math.max(0, salary - employeePensionContribution);
                        const fullTaxAndNI = calculateUKIncomeTaxAndNI(salary, false, config.is_scottish);
                        const taxOnAdjusted = calculateUKIncomeTaxAndNI(taxOnlyAdjusted, false, config.is_scottish).tax;
                        
                        studentLoanDeduction = calculateStudentLoanRepayments(salary, activeStudentLoanPlans).annualDeduction;

                        actualNetTakeHome = salary - taxOnAdjusted - fullTaxAndNI.ni - employeePensionContribution - studentLoanDeduction;
                    }

                    // 3. Compute ISA Savings (Validated and Capped)
                    const cashIsaRequested = actualNetTakeHome * (parseFloat(config.cash_isa_percent) || 0) / 100;
                    const stocksIsaRequested = actualNetTakeHome * (parseFloat(config.stocks_isa_percent) || 0) / 100;
                    const lisaRequested = actualNetTakeHome * (parseFloat(config.lisa_percent) || 0) / 100;

                    const isaValidation = validateISAContributions(year, age, cashIsaRequested, stocksIsaRequested, lisaRequested);
                    if (!isaValidation.isValid) {
                        isaValidation.errors.forEach(err => {
                            if (!systemMessage.includes("ISA")) systemMessage += err + " ";
                        });
                    }

                    let actualLisaAdded = Math.min(lisaRequested, 4000);
                    let actualCashIsaAdded = cashIsaRequested;
                    if (year >= 2027 && age < 65) {
                        actualCashIsaAdded = Math.min(actualCashIsaAdded, 12000);
                    }
                    let remainingIsaSpace = Math.max(0, 20000 - actualLisaAdded - actualCashIsaAdded);
                    let actualStocksIsaAdded = Math.min(stocksIsaRequested, remainingIsaSpace);

                    // Apply LISA Bonus (+25% on LISA deposits)
                    const lisaBonus = actualLisaAdded * 0.25;

                    const outOfPocketISAThisYear = actualCashIsaAdded + actualStocksIsaAdded + actualLisaAdded;
                    const isaAddedThisYear = outOfPocketISAThisYear + lisaBonus;

                    // Accumulate records
                    cumulativeContributionsPension += totalAnnualPensionContribution;
                    cumulativeContributionsISA += outOfPocketISAThisYear;

                    // 4. Track Cost of Living Expenses
                    const years_passed = age - current_age;
                    const annual_bills_inflated = (monthly_bills_base * 12) * Math.pow(1 + inflation_rate, years_passed);
                    const surplusDiscretionary = actualNetTakeHome - outOfPocketISAThisYear - annual_bills_inflated;

                    // 5. Portfolio Growth Compounding (End-of-Year Assumption)
                    pension_balance = (pension_balance * (1 + return_rate)) + totalAnnualPensionContribution;
                    isa_balance = (isa_balance * (1 + return_rate)) + isaAddedThisYear;

                    const totalNominalCombined = pension_balance + isa_balance;
                    const totalRealCombined = totalNominalCombined / Math.pow(1 + inflation_rate, years_passed);

                    dataPoints.push({
                        age,
                        salary,
                        netTakeHome: actualNetTakeHome,
                        studentLoanDeduction: studentLoanDeduction,
                        pensionAdded: totalAnnualPensionContribution,
                        isaAdded: outOfPocketISAThisYear,
                        lisaBonusAdded: lisaBonus,
                        bills: annual_bills_inflated,
                        discretionary: surplusDiscretionary,
                        pensionBalance: pension_balance,
                        isaBalance: isa_balance,
                        nominalCombined: totalNominalCombined,
                        realCombined: totalRealCombined,
                        eventLog: systemMessage.trim()
                    });

                    // Update Salary for next cycle
                    salary = salary * (1 + wage_growth);
                }

                return { 
                    dataPoints, 
                    cumulativeContributionsPension, 
                    cumulativeContributionsISA,
                    annualPensionAllowanceWarningTriggered,
                    finalNominalPension: pension_balance,
                    finalNominalISA: isa_balance
                };
            }, [config]);

            // Master Decumulation Engine Simulator (UK Retrospective Tax-Managed Model)
            const decumulationData = useMemo(() => {
                const target_age = parseInt(config.target_age) || 60;
                const current_age = parseInt(config.current_age) || 30;
                
                let pension_pool = projectionData.finalNominalPension;
                let isa_pool = projectionData.finalNominalISA;

                const spendToday = parseFloat(config.retire_annual_spend_today) || 32000;
                const growthRate = (parseFloat(config.retire_growth_percent) || 4.5) / 100;
                const inflation_rate = (parseFloat(config.inflation_percent) || 2.5) / 100;
                
                const yearsAccumulating = target_age - current_age;
                let inflatedAnnualSpendingGoal = spendToday * Math.pow(1 + inflation_rate, yearsAccumulating);

                let age = target_age;
                const simPoints = [];
                let runsOutAtAge = null;
                const maxAgeSimulationLimit = 110;

                while (age <= maxAgeSimulationLimit) {
                    const currentYearsElapsedTotal = yearsAccumulating + (age - target_age);
                    
                    // 1. Process State Pension contribution (Adjusted for cumulative inflation)
                    let activeStatePension = 0;
                    if (config.state_pension_active && age >= config.state_pension_age) {
                        activeStatePension = (parseFloat(config.state_pension_amount_today) || 11502) * Math.pow(1 + inflation_rate, currentYearsElapsedTotal);
                    }

                    // 2. Identify spending deficit needed from private balances
                    const netRequiredFromPortfolio = Math.max(0, inflatedAnnualSpendingGoal - activeStatePension);

                    let drawnFromISA = 0;
                    let grossDrawnFromPension = 0;
                    let taxPaidThisYear = 0;

                    if (netRequiredFromPortfolio > 0) {
                        if (config.decumulation_strategy === 'isa_first') {
                            // Exhaust ISA pot first (withdrawn completely tax-free)
                            if (isa_pool >= netRequiredFromPortfolio) {
                                drawnFromISA = netRequiredFromPortfolio;
                                isa_pool -= drawnFromISA;
                            } else {
                                drawnFromISA = isa_pool;
                                isa_pool = 0;

                                const pensionGap = netRequiredFromPortfolio - drawnFromISA;
                                grossDrawnFromPension = solveGrossPensionWithdrawal(pensionGap, activeStatePension, config.is_scottish);
                                
                                const taxablePensionPortion = grossDrawnFromPension * 0.75;
                                taxPaidThisYear = calculateUKIncomeTaxAndNI(activeStatePension + taxablePensionPortion, true, config.is_scottish).tax - calculateUKIncomeTaxAndNI(activeStatePension, true, config.is_scottish).tax;
                                pension_pool = Math.max(0, pension_pool - grossDrawnFromPension);
                            }
                        } else {
                            // Blended/Pension-First: Cover baseline gap with Pension pot where possible
                            const grossPensionAttempt = solveGrossPensionWithdrawal(netRequiredFromPortfolio, activeStatePension, config.is_scottish);
                            if (pension_pool >= grossPensionAttempt) {
                                grossDrawnFromPension = grossPensionAttempt;
                                pension_pool -= grossDrawnFromPension;

                                const taxablePensionPortion = grossDrawnFromPension * 0.75;
                                taxPaidThisYear = calculateUKIncomeTaxAndNI(activeStatePension + taxablePensionPortion, true, config.is_scottish).tax - calculateUKIncomeTaxAndNI(activeStatePension, true, config.is_scottish).tax;
                            } else {
                                // Empty out Pension and extract remaining target deficit from ISA
                                const maxPensionCanGiveGross = pension_pool;
                                pension_pool = 0;

                                const taxablePensionPortion = maxPensionCanGiveGross * 0.75;
                                const maxPensionCanGiveNet = (maxPensionCanGiveGross * 0.25) + (taxablePensionPortion - (calculateUKIncomeTaxAndNI(activeStatePension + taxablePensionPortion, true, config.is_scottish).tax - calculateUKIncomeTaxAndNI(activeStatePension, true, config.is_scottish).tax));
                                
                                grossDrawnFromPension = maxPensionCanGiveGross;
                                taxPaidThisYear = calculateUKIncomeTaxAndNI(activeStatePension + taxablePensionPortion, true, config.is_scottish).tax - calculateUKIncomeTaxAndNI(activeStatePension, true, config.is_scottish).tax;

                                const isaGap = Math.max(0, netRequiredFromPortfolio - maxPensionCanGiveNet);
                                drawnFromISA = Math.min(isa_pool, isaGap);
                                isa_pool = Math.max(0, isa_pool - drawnFromISA);
                            }
                        }
                    }

                    // 3. Compounding residual portfolio assets at end of fiscal cycle
                    pension_pool = pension_pool * (1 + growthRate);
                    isa_pool = isa_pool * (1 + growthRate);

                    const closingCombinedNominal = pension_pool + isa_pool;
                    const closingCombinedReal = closingCombinedNominal / Math.pow(1 + inflation_rate, currentYearsElapsedTotal);

                    simPoints.push({
                        age,
                        openingPension: pension_pool / (1 + growthRate) + grossDrawnFromPension,
                        openingISA: isa_pool / (1 + growthRate) + drawnFromISA,
                        statePensionReceived: activeStatePension,
                        withdrawnISA: drawnFromISA,
                        withdrawnPensionGross: grossDrawnFromPension,
                        taxPaid: taxPaidThisYear,
                        spendingDemanded: inflatedAnnualSpendingGoal,
                        closingCombinedNominal,
                        closingCombinedReal
                    });

                    // Termination Condition
                    if (closingCombinedNominal <= 0 && netRequiredFromPortfolio > (drawnFromISA + (grossDrawnFromPension * 0.25 + grossDrawnFromPension * 0.75 - taxPaidThisYear))) {
                        runsOutAtAge = age;
                        break;
                    }

                    inflatedAnnualSpendingGoal = inflatedAnnualSpendingGoal * (1 + inflation_rate);
                    age++;
                }

                const longevityReport = runsOutAtAge 
                    ? `Capital exhaustion projection triggered at age ${runsOutAtAge}. Total security window: ${runsOutAtAge - target_age} years.`
                    : `Sustained asset preservation. Portfolio yield structure outpaces depletion rate limits up to age ${maxAgeSimulationLimit}.`;

                return {
                    simPoints,
                    runsOutAtAge,
                    longevityReport
                };
            }, [config, projectionData]);

            // High Contrast SVG Chart Path Calculators
            const chartData = useMemo(() => {
                const points = projectionData.dataPoints;
                const width = 800;
                const height = 300;
                const paddingLeft = 85;
                const paddingRight = 25;
                const paddingTop = 25;
                const paddingBottom = 40;

                if (points.length === 0) {
                    return { pensionPath: "", isaPath: "", realPath: "", gridLines: [], ageTicks: [], height, width };
                }

                const maxBalance = Math.max(...points.map(p => p.nominalCombined), 50000) * 1.05;
                const minBalance = 0;
                const balanceRange = maxBalance - minBalance || 1;

                const getX = (index) => {
                    if (points.length <= 1) return paddingLeft;
                    return paddingLeft + (index / (points.length - 1)) * (width - paddingLeft - paddingRight);
                };
                
                const getY = (val) => {
                    return height - paddingBottom - ((val - minBalance) / balanceRange) * (height - paddingTop - paddingBottom);
                };

                let pensionPath = `M ${getX(0)} ${getY(points[0].pensionBalance)} `;
                let isaPath = `M ${getX(0)} ${getY(points[0].isaBalance)} `;
                let realPath = `M ${getX(0)} ${getY(points[0].realCombined)} `;

                for (let i = 1; i < points.length; i++) {
                    pensionPath += `L ${getX(i)} ${getY(points[i].pensionBalance)} `;
                    isaPath += `L ${getX(i)} ${getY(points[i].isaBalance)} `;
                    realPath += `L ${getX(i)} ${getY(points[i].realCombined)} `;
                }

                const gridTicks = 5;
                const gridLines = [];
                for (let i = 0; i < gridTicks; i++) {
                    const value = minBalance + (i / (gridTicks - 1)) * (maxBalance - minBalance);
                    gridLines.push({
                        y: getY(value),
                        label: `£${(value / 1000).toFixed(0)}k`
                    });
                }

                const ageTicks = [];
                const step = Math.max(1, Math.floor(points.length / 6));
                for (let i = 0; i < points.length; i += step) {
                    ageTicks.push({
                        x: getX(i),
                        label: `Age ${points[i].age}`
                    });
                }
                if (points.length > 1 && (points.length - 1) % step !== 0) {
                    ageTicks.push({
                        x: getX(points.length - 1),
                        label: `Age ${points[points.length - 1].age}`
                    });
                }

                return { pensionPath, isaPath, realPath, gridLines, ageTicks, height, width };
            }, [projectionData]);

            return (

                            </p>

                            </div>
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <div className="tab-nav">

                            Engine Matrix & Charts
                        </button>
                        <button
                            onClick={() => setActiveTab('trajectory-report')}

                    </div>

                    {/* Monospace KPI Metrics Grid */}
                    <div className="metrics-grid">
                        <div className="metric-card">
                            <div>
                                <div className="metric-label">Pension Pot (Nominal)</div>
                                <div className="metric-value">
                                    £{projectionData.finalNominalPension.toLocaleString(undefined, { maximumFractionDigits: 0 })}
                                </div>
                            </div>
                            <div className="metric-sub">Accumulated at age {config.target_age}</div>
                        </div>
                        <div className="metric-card">
                            <div>
                                <div className="metric-label">ISA Pot (Nominal)</div>
                                <div className="metric-value" style={{ color: 'var(--text-primary)' }}>
                                    £{projectionData.finalNominalISA.toLocaleString(undefined, { maximumFractionDigits: 0 })}
                                </div>
                            </div>
                            <div className="metric-sub">Liquid tax-free capital accumulated</div>
                        </div>
                        <div className="metric-card">
                            <div>
                                <div className="metric-label">Purchasing Power (Real)</div>
                                <div className="metric-value" style={{ color: 'var(--swiss-red)' }}>
                                    £{(projectionData.finalNominalPension + projectionData.finalNominalISA > 0 ? (projectionData.dataPoints[projectionData.dataPoints.length - 1]?.realCombined || 0) : 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}
                                </div>
                            </div>

                                </div>

                    {activeTab === 'projection' ? (

                                    <div>

                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="form-block">
                                    <h3 className="card-subtitle">4. Life Milestones</h3>
                                    <div className="form-grid-2">
                                        <div>
                                            <label>Milestone Age</label>
                                            <input
                                                type="number"
                                                min={config.current_age}
                                                max={config.target_age}
                                                value={newEvent.age}
                                                onChange={(e) => setNewEvent(prev => ({ ...prev, age: e.target.value }))}
                                            />
                                        </div>
                                        <div>
                                            <label>Adjustment Type</label>
                                            <select
                                                value={newEvent.type}
                                                onChange={(e) => setNewEvent(prev => ({ ...prev, type: e.target.value }))}
                                            >
                                                <option value="salary_change">Salary Adjustment (£)</option>
                                                <option value="contribution_change">Ee Pension Contrib (%)</option>
                                                <option value="expense">Capital Withdrawal (£)</option>
                                                <option value="windfall">Portfolio Injection (£)</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label>Modifier Metric Value</label>
                                        <input
                                            type="number"
                                            placeholder="Amount (£) or Rate (%)"
                                            value={newEvent.value}
                                            onChange={(e) => setNewEvent(prev => ({ ...prev, value: e.target.value }))}
                                        />
                                    </div>
                                    <div>
                                        <label>Milestone Label</label>
                                        <input
                                            type="text"
                                            placeholder="e.g. Senior Director Uplift"
                                            value={newEvent.description}
                                            onChange={(e) => setNewEvent(prev => ({ ...prev, description: e.target.value }))}
                                        />
                                    </div>
                                    {validationError && (
                                        <p style={{ color: 'var(--swiss-red)', fontSize: '0.7rem', fontWeight: 'bold' }}>{validationError}</p>
                                    )}
                                    <button onClick={addEvent} className="btn-action">
                                        <Icons.Plus /> Append Milestone Event
                                    </button>
                                </div>
                            </div>

                            {/* Main Calculations Screen */}
                            <div className="panel-content">
                                
                                {/* Retirement Sustainability System Box */}
                                <div className="info-panel" style={{ borderLeft: '3px solid var(--swiss-red)' }}>
                                    <div className="info-panel-title">Asset Longevity Projections</div>
                                    <p style={{ color: 'var(--text-primary)', fontWeight: '700', fontSize: '0.9rem', marginBottom: '0.5rem' }}>
                                        {decumulationData.longevityReport}
                                    </p>
                                    <p style={{ fontSize: '0.75rem' }}>
                                        Targeting annual cash generation equivalent to £{(parseFloat(config.retire_annual_spend_today) || 0).toLocaleString()} in current purchasing power. Capital asset valuation at retirement entry: £{(projectionData.finalNominalPension + projectionData.finalNominalISA).toLocaleString(undefined, { maximumFractionDigits: 0 })} (Pension: £{projectionData.finalNominalPension.toLocaleString(undefined, { maximumFractionDigits: 0 })}, ISA: £{projectionData.finalNominalISA.toLocaleString(undefined, { maximumFractionDigits: 0 })}) at age {config.target_age}.
                                    </p>
                                </div>

                                {/* Dynamic Trajectory Diagram */}
                                <div style={{ border: '1px solid var(--border-color)', padding: '1.5rem', background: '#08080a' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', flexWrap: 'wrap', gap: '1rem' }}>
                                        <h3 className="card-subtitle" style={{ margin: 0 }}>Accumulation Projections</h3>
                                        <div className="chart-legend">
                                            <div className="legend-item">
                                                <span style={{ width: '12px', height: '2px', background: 'var(--swiss-red)', display: 'inline-block' }}></span>
                                                <span>Pension Pot</span>
                                            </div>
                                            <div className="legend-item">
                                                <span style={{ width: '12px', height: '2px', background: 'var(--text-primary)', display: 'inline-block' }}></span>
                                                <span>ISA Pot</span>
                                            </div>
                                            <div className="legend-item">
                                                <span style={{ width: '12px', height: '2px', strokeDasharray: '3,3', borderBottom: '2px dotted var(--text-secondary)', display: 'inline-block' }}></span>
                                                <span>Combined (Real Value)</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div style={{ width: '100%' }}>
                                        {projectionData.dataPoints.length > 0 ? (
                                            <svg viewBox={`0 0 ${chartData.width} ${chartData.height}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
                                                {/* Grid Alignments */}
                                                {chartData.gridLines.map((line, idx) => (
                                                    <g key={idx}>
                                                        <line
                                                            x1="85"
                                                            y1={line.y}
                                                            x2={chartData.width - 25}
                                                            y2={line.y}
                                                            stroke="var(--border-color)"
                                                            strokeWidth="1"
                                                            strokeDasharray="2,2"
                                                        />
                                                        <text x="15" y={line.y + 4} fill="var(--text-secondary)" style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', fontWeight: 'bold' }}>{line.label}</text>
                                                    </g>
                                                ))}

                                                {/* Vertical Age Tick Marks */}
                                                {chartData.ageTicks.map((tick, idx) => (
                                                    <g key={idx}>
                                                        <line
                                                            x1={tick.x}
                                                            y1="25"
                                                            x2={tick.x}
                                                            y2={chartData.height - 40}
                                                            stroke="var(--border-color)"
                                                            strokeWidth="1"
                                                            strokeDasharray="2,2"
                                                        />
                                                        <text x={tick.x} y={chartData.height - 15} textAnchor="middle" fill="var(--text-secondary)" style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', fontWeight: 'bold' }}>{tick.label}</text>
                                                    </g>
                                                ))}

                                                {/* Primary Curve Paths */}
                                                {chartData.pensionPath && (
                                                    <path
                                                        d={chartData.pensionPath}
                                                        fill="none"
                                                        stroke="var(--swiss-red)"
                                                        strokeWidth="2"
                                                    />
                                                )}

                                                {chartData.isaPath && (
                                                    <path
                                                        d={chartData.isaPath}
                                                        fill="none"
                                                        stroke="var(--text-primary)"
                                                        strokeWidth="2"
                                                    />
                                                )}

                                                {chartData.realPath && (
                                                    <path
                                                        d={chartData.realPath}
                                                        fill="none"
                                                        stroke="var(--text-secondary)"
                                                        strokeWidth="1.5"
                                                        strokeDasharray="4,3"
                                                    />
                                                )}
                                            </svg>
                                        ) : (
                                            <div style={{ height: '250px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-secondary)', fontStyle: 'italic', fontFamily: 'var(--font-mono)' }}>
                                                Timeline metrics calculations pending...
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Active Life Milestones Block */}
                                <div style={{ border: '1px solid var(--border-color)', padding: '1.5rem', background: '#08080a' }}>
                                    <h3 className="card-subtitle" style={{ marginBottom: '1rem' }}>Active Life Milestones</h3>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem', maxHeight: '200px', overflowY: 'auto' }}>
                                        {config.events.length === 0 ? (
                                            <p style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', fontStyle: 'italic' }}>No custom timeline milestones saved.</p>
                                        ) : (
                                            config.events.map((ev) => (
                                                <div key={ev.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.75rem', background: '#0c0c0e', border: '1px solid var(--border-color)' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem', fontWeight: 'bold', color: 'var(--swiss-red)' }}>
                                                            Age {ev.age}
                                                        </div>
                                                        <div>
                                                            <div style={{ fontSize: '0.75rem', fontWeight: 'bold' }}>{ev.description}</div>
                                                            <div style={{ fontSize: '0.65rem', color: 'var(--text-secondary)', textTransform: 'uppercase' }}>
                                                                Type: {ev.type.replace('_', ' ')} | Value: {ev.type === 'salary_change' || ev.type === 'expense' || ev.type === 'windfall' ? `£${ev.value.toLocaleString()}` : `${ev.value}%`}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => removeEvent(ev.id)} className="header-icon-btn" style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--text-secondary)' }}>
                                                        <Icons.Trash />
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                {/* Asset Accumulation Ledger Table */}
                                <div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                                        <h3 className="card-subtitle" style={{ margin: 0 }}>Accumulation Phase Ledger</h3>
                                        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.7rem', color: 'var(--text-secondary)' }}>
                                            Age {config.current_age} to {config.target_age - 1}
                                        </span>
                                    </div>
                                    <div className="swiss-table-container" style={{ maxHeight: '350px' }}>
                                        <table className="swiss-table">
                                            <thead>
                                                <tr>
                                                    <th>Age</th>
                                                    <th>Gross Salary</th>
                                                    <th>Net Take-Home</th>
                                                    <th>Student Loan</th>
                                                    <th>Pension Addition</th>
                                                    <th>ISA Dep (Net)</th>
                                                    <th>LISA Bonus</th>
                                                    <th>Living Expenses</th>
                                                    <th>Surplus Cash</th>
                                                    <th>Pension Balance</th>
                                                    <th>ISA Balance</th>
                                                    <th>Nominal Combined</th>
                                                    <th>Real Combined (Purchasing Power)</th>
                                                    <th>Milestone Log</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {projectionData.dataPoints.map((row, idx) => (
                                                    <tr key={idx} className={row.eventLog ? 'highlighted' : ''}>
                                                        <td style={{ fontWeight: 'bold', color: 'var(--text-primary)' }}>{row.age}</td>
                                                        <td>£{row.salary.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ color: 'var(--text-primary)', fontWeight: 'bold' }}>£{row.netTakeHome.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ color: 'var(--swiss-red)' }}>£{row.studentLoanDeduction.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ color: '#00cc66' }}>£{row.pensionAdded.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ color: '#00a3ff' }}>£{row.isaAdded.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ color: '#00a3ff' }}>£{row.lisaBonusAdded.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td>£{row.bills.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ color: row.discretionary >= 0 ? 'var(--text-primary)' : 'var(--swiss-red)' }}>
                                                            £{row.discretionary.toLocaleString(undefined, { maximumFractionDigits: 0 })}
                                                        </td>
                                                        <td>£{row.pensionBalance.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td>£{row.isaBalance.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ fontWeight: 'bold' }}>£{row.nominalCombined.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ fontWeight: 'bold', color: 'var(--swiss-red)' }}>£{row.realCombined.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ fontSize: '0.65rem', color: 'var(--text-secondary)', fontStyle: 'italic' }}>{row.eventLog}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Asset Decumulation Ledger Table */}
                                <div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                                        <h3 className="card-subtitle" style={{ margin: 0 }}>Decumulation Phase Ledger (Tax-Managed)</h3>
                                        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.7rem', color: 'var(--text-secondary)' }}>
                                            Retirement Span starting Age {config.target_age}
                                        </span>
                                    </div>
                                    <div className="swiss-table-container" style={{ maxHeight: '350px' }}>
                                        <table className="swiss-table">
                                            <thead>
                                                <tr>
                                                    <th>Age</th>
                                                    <th>Opening Pension</th>
                                                    <th>Opening ISA</th>
                                                    <th>State Pension</th>
                                                    <th>ISA Drawdown (Tax-Free)</th>
                                                    <th>Pension Drawdown (Gross)</th>
                                                    <th>Estimated Tax Paid</th>
                                                    <th>Total Retirement Spend (Nominal)</th>
                                                    <th>Closing Combined (Nominal)</th>
                                                    <th>Closing Combined (Real Value)</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {decumulationData.simPoints.map((row, idx) => (
                                                    <tr key={idx}>
                                                        <td style={{ fontWeight: 'bold', color: 'var(--text-primary)' }}>{row.age}</td>
                                                        <td>£{row.openingPension.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td>£{row.openingISA.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ color: '#00cc66' }}>£{row.statePensionReceived.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td>£{row.withdrawnISA.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td>£{row.withdrawnPensionGross.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ color: 'var(--swiss-red)' }}>£{row.taxPaid.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ fontWeight: 'bold' }}>£{row.spendingDemanded.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ fontWeight: 'bold' }}>£{row.closingCombinedNominal.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                        <td style={{ fontWeight: 'bold', color: 'var(--swiss-red)' }}>£{row.closingCombinedReal.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>
                        </div>
                    ) : (
                        /* Structural planning guide utilizing style.css section architecture */
                        <div className="section-grid" style={{ minHeight: '50vh' }}>
                            <div className="section-sidebar">
                                <span className="section-num">01 // REGULATORY LOGIC</span>
                                <h2 className="section-title">UK WEALTH PLANNING STRUCTURE</h2>
                            </div>
                            <div className="section-content">
                                <div className="item-row">
                                    <div className="item-meta">WORKPLACE PENSIONS // ACCUMULATION</div>
                                    <div className="item-details">
                                        <h3 className="item-heading">Salary Sacrifice vs Net Pay Arrangements</h3>
                                        <p style={{ color: 'var(--text-secondary)', fontSize: '0.85rem' }}>
                                            Under a Salary Sacrifice framework, employee contributions are deducted from gross earnings before Income Tax, National Insurance, and Student Loan calculation, yielding immediate multidimensional savings. Net Pay arrangements also grant immediate Income Tax relief, but do not provide National Insurance or Student Loan contribution savings. Lifetime retirement plans should monitor annual pension contributions to stay within the £60,000 statutory tax-free allowance limit.
                                        </p>
                                    </div>
                                </div>
                                <div className="item-row">
                                    <div className="item-meta">TAX WRAPPERS // ISA SYSTEM</div>
                                    <div className="item-details">
                                        <h3 className="item-heading">The £20,000 Individual Savings Account (ISA) Shield</h3>
                                        <p style={{ color: 'var(--text-secondary)', fontSize: '0.85rem' }}>
                                            The Individual Savings Account (ISA) remains a highly versatile tool in UK wealth optimization. Although contributions must be sourced from post-tax earnings, capital returns and future withdrawals are completely exempt from UK Capital Gains and Income Taxes. Integrating an ISA alongside pension assets creates a valuable tax-free reserve to draw from in retirement. Limits will adjust dynamically for those under 65 starting in 2027.
                                        </p>
                                    </div>
                                </div>
                                <div className="item-row">
                                    <div className="item-meta">DECUMULATION // WITHDRAWAL OPTIMIZATION</div>
                                    <div className="item-details">
                                        <h3 className="item-heading">Managing the 25% Tax-Free Lump Sum (UFPLS)</h3>
                                        <p style={{ color: 'var(--text-secondary)', fontSize: '0.85rem' }}>
                                            When taking pension benefits via Flexi-Access Drawdown or Uncrystallized Funds Pension Lump Sum (UFPLS) rules, 25% of each withdrawal is generally tax-free. The remaining 75% is treated as taxable pension income and is subject to standard UK Income Tax marginal rates (excluding National Insurance). This system models these dynamics annually to project potential retirement tax liabilities.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer>
                        <div>PLANNING ENGINE SYSTEM / DUAL VECTOR PROJECTIONS</div>
                        <div>ALL CALCULATIONS MODEL ASSUMED UK FISCAL VARIABLES. ACTUAL MARKET AND POLICY OUTCOMES WILL VARY.</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
